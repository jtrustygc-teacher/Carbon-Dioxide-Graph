<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stomatal Index vs Atmospheric CO2 Calibration Tool</title>
  <style>
    /* CSS RESET & VARIABLES */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --primary-light: #e0f2fe;
      --border-color: #cbd5e1;
      --accent: #d97706;
      --warning-bg: #fffbebf8;
      --warning-border: #fef3c7;
      --warning-text: #92400e;
      --focus-ring: #0284c7;
      
      --font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      --space-xs: 0.25rem;
      --space-sm: 0.5rem;
      --space-md: 1rem;
      --space-lg: 1.5rem;
      --space-xl: 2rem;
      
      --radius-sm: 0.375rem;
      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;
      
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding: var(--space-md);
    }

    /* ACCESSIBILITY: VISIBLE FOCUS INDICATORS */
    *:focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 3px;
    }

    /* SKIP LINK FOR KEYBOARD USERS */
    .skip-link {
      position: absolute;
      top: -40px;
      left: 0;
      background: var(--primary);
      color: white;
      padding: var(--space-sm) var(--space-md);
      z-index: 100;
      transition: top 0.2s ease;
      text-decoration: none;
      font-weight: 600;
      border-radius: 0 0 var(--radius-sm) 0;
    }
    .skip-link:focus {
      top: 0;
    }

    /* MAIN CONTAINER - SINGLE PANE CENTERED LAYOUT */
    .container {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-lg);
    }

    header {
      background-color: var(--card-bg);
      padding: var(--space-lg);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }

    h1 {
      font-size: 1.75rem;
      color: var(--text-main);
      margin-bottom: var(--space-xs);
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: var(--space-md);
    }

    .header-actions {
      display: flex;
      gap: var(--space-md);
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      padding: var(--space-sm) var(--space-md);
      background-color: var(--primary);
      color: white;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    .btn:hover {
      background-color: var(--primary-hover);
    }
    .btn-secondary {
      background-color: white;
      color: var(--text-main);
      border-color: var(--border-color);
    }
    .btn-secondary:hover {
      background-color: var(--bg-color);
    }

    /* GRAPH CONTAINER & CANVAS WRAPPER */
    .graph-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: var(--space-lg);
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .graph-wrapper {
      position: relative;
      width: 100%;
      background-color: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    /* Direct Image & Vector Fallback */
    .graph-img-container {
      position: relative;
      width: 100%;
      display: block;
    }

    .graph-img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* SVG Overlay Layer */
    .interactive-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Interactive Marker Handle */
    .curve-handle {
      position: absolute;
      width: 24px;
      height: 24px;
      margin-left: -12px;
      margin-top: -12px;
      background-color: #dc2626;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 0 2px #dc2626, 0 4px 6px rgba(0,0,0,0.3);
      cursor: grab;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      z-index: 10;
      pointer-events: auto;
    }
    .curve-handle:hover, .curve-handle:focus {
      transform: scale(1.2);
    }

    /* Floating Tooltip Callout */
    .handle-callout {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #ffffff;
      padding: var(--space-xs) var(--space-sm);
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      white-space: nowrap;
      pointer-events: none;
      box-shadow: var(--shadow-md);
      font-weight: 600;
    }
    .handle-callout::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      margin-left: -5px;
      border-width: 5px;
      border-style: solid;
      border-color: #0f172a transparent transparent transparent;
    }

    /* CONTROLS SECTION */
    .controls-panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: var(--space-lg);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .slider-label {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--text-main);
    }

    .slider-val-badge {
      background: var(--primary-light);
      color: var(--primary-hover);
      font-weight: 700;
      padding: var(--space-xs) var(--space-sm);
      border-radius: var(--radius-sm);
      font-size: 1rem;
    }
